<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Pedidos - Salgados & Cia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f6faf6; color: #1a2e1a; min-height: 100vh; }
        .container { max-width: 720px; margin: 0 auto; padding: 16px; }
        .header-cliente { background: linear-gradient(135deg, #16a34a, #15803d); padding: 16px 0; box-shadow: 0 4px 20px rgba(22,163,74,0.3); }
        .header-cliente .container { display: flex; justify-content: space-between; align-items: center; }
        .header-cliente h1 { font-size: 20px; font-weight: 800; color: #fff; }
        .header-cliente h1 span { font-weight: 300; }
        .btn-back { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 8px 14px; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 600; text-decoration: none; }
        .btn-back:hover { background: rgba(255,255,255,0.25); }
        .card { background: #fff; border-radius: 14px; padding: 20px; border: 1px solid #e5e7eb; margin-bottom: 16px; }
        .card h2 { font-size: 18px; font-weight: 700; margin-bottom: 14px; }
        .consulta-row { display: flex; gap: 8px; }
        .consulta-row input { flex: 1; padding: 13px 14px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 15px; outline: none; font-family: 'Inter', sans-serif; }
        .consulta-row input:focus { border-color: #16a34a; box-shadow: 0 0 0 3px rgba(22,163,74,0.15); }
        .btn-consultar { padding: 13px 20px; background: linear-gradient(135deg, #16a34a, #15803d); border: none; border-radius: 10px; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; font-family: 'Inter', sans-serif; }
        .btn-consultar:hover { box-shadow: 0 8px 25px rgba(22,163,74,0.3); }
        .btn-consultar:disabled { opacity: 0.5; cursor: not-allowed; }
        .msg { font-size: 13px; padding: 10px 12px; border-radius: 8px; margin-top: 12px; display: none; text-align: center; }
        .msg.show { display: block; }
        .msg.error { background: #fef2f2; color: #dc2626; }
        .msg.info { background: #ecfdf5; color: #047857; }
        .pedido-card { background: #fff; border-radius: 14px; padding: 16px; border: 1px solid #e5e7eb; margin-bottom: 12px; cursor: pointer; transition: all 0.2s; }
        .pedido-card:hover { border-color: #16a34a; box-shadow: 0 4px 16px rgba(22,163,74,0.12); }
        .pedido-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .pedido-id { font-weight: 700; color: #16a34a; }
        .pedido-data { font-size: 12px; color: #6b7280; }
        .pedido-status { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; color: #fff; }
        .pedido-info { font-size: 13px; color: #4b5563; margin-top: 6px; }
        .pedido-info strong { color: #1a2e1a; }
        .pedido-total { font-size: 15px; font-weight: 800; color: #16a34a; margin-top: 8px; }
        .empty { text-align: center; color: #9ca3af; padding: 30px 0; }
        .empty i { font-size: 40px; margin-bottom: 10px; }
        /* Modal de detalhes */
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 300; justify-content: center; align-items: center; padding: 16px; }
        .overlay.active { display: flex; }
        .modal { background: #fff; border-radius: 16px; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; padding: 24px; }
        .modal h2 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
        .modal .sub { font-size: 13px; color: #6b7280; margin-bottom: 16px; }
        .modal-close { background: transparent; border: none; font-size: 24px; cursor: pointer; color: #6b7280; float: right; }
        .sec-titulo { font-size: 12px; font-weight: 700; color: #16a34a; text-transform: uppercase; letter-spacing: 0.5px; margin: 16px 0 8px; }
        .linha { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; }
        .linha.total { font-weight: 800; font-size: 16px; border-top: 1px solid #e5e7eb; margin-top: 6px; padding-top: 10px; color: #16a34a; }
        .item-linha { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-bottom: 1px solid #f3f4f6; }
        .item-linha .nome { flex: 1; }
        .item-linha .qtd { color: #6b7280; margin: 0 8px; }
        .item-linha .preco { font-weight: 600; }
        .timeline { border-left: 2px solid #16a34a; margin-left: 6px; padding-left: 14px; }
        .tl-item { position: relative; padding: 6px 0; }
        .tl-item::before { content: ''; position: absolute; left: -19px; top: 12px; width: 10px; height: 10px; border-radius: 50%; background: #16a34a; }
        .tl-item .st { font-weight: 700; font-size: 13px; color: #1a2e1a; }
        .tl-item .dt { font-size: 11px; color: #9ca3af; }
        .tl-item .obs { font-size: 12px; color: #6b7280; margin-top: 2px; }
        .status-badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 5px 12px; border-radius: 20px; color: #fff; margin-bottom: 8px; }
        .loading { text-align: center; color: #6b7280; padding: 20px; }
        .loading i { font-size: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .toast { position: fixed; bottom: 20px; right: 20px; padding: 14px 20px; border-radius: 10px; color: #fff; font-size: 13px; font-weight: 500; z-index: 2000; display: none; }
        .toast.show { display: block; }
        .toast.success { background: #059669; }
        .toast.error { background: #dc2626; }
    </style>
</head>
<body>
    <header class="header-cliente">
        <div class="container">
            <h1>Meus <span>Pedidos</span></h1>
            <a href="/" class="btn-back"><i class="fas fa-arrow-left"></i> Voltar</a>
        </div>
    </header>
    <main class="container">
        <div class="card">
            <h2>🔍 Consultar pedidos</h2>
            <p style="font-size:13px;color:#6b7280;margin-bottom:12px;">Digite o telefone usado no pedido para ver todos os seus pedidos e o histórico. Se estiver logado, o número é preenchido automaticamente.</p>
            <div class="consulta-row">
                <input type="tel" id="telefone" placeholder="(11) 99999-9999" inputmode="numeric">
                <button class="btn-consultar" id="btnConsultar" onclick="consultar()"><i class="fas fa-search"></i> Consultar</button>
            </div>
            <div class="msg error" id="msgErro"></div>
            <div class="msg info" id="msgInfo"></div>
        </div>
        <div id="listaPedidos"></div>
    </main>

    <!-- Modal de detalhes -->
    <div class="overlay" id="overlay">
        <div class="modal">
            <button class="modal-close" onclick="fecharModal()">&times;</button>
            <div id="modalConteudo"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API = '/api';
        let telefoneAtual = '';
        let pedidosCache = [];

        function mostrarToast(msg, tipo) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast ' + tipo + ' show';
            setTimeout(() => t.classList.remove('show'), 3500);
        }
        function fmt(v) { return parseFloat(v).toFixed(2).replace('.', ','); }
        function fmtData(dt) {
            if (!dt) return '—';
            const d = new Date(dt);
            return d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }
        function statusCor(status) {
            const map = {
                'Aguardando Confirmacao': '#f59e0b',
                'Pendente': '#2563eb',
                'Em Producao': '#f97316',
                'Em Andamento': '#7c3aed',
                'Entregue': '#16a34a',
                'Cancelado': '#dc2626'
            };
            return map[status] || '#6b7280';
        }
        function statusBadge(status) {
            return `<span class="status-badge" style="background:${statusCor(status)}">${status}</span>`;
        }
        function preencherTelefoneLogado() {
            try {
                const dados = JSON.parse(localStorage.getItem('clienteDados') || 'null');
                if (dados && dados.telefone) {
                    const tel = dados.telefone;
                    document.getElementById('telefone').value = tel;
                    // formata para exibição
                    consultar(true);
                }
            } catch (e) {}
        }
        async function consultar(auto) {
            const telefone = document.getElementById('telefone').value.trim();
            const btn = document.getElementById('btnConsultar');
            const errEl = document.getElementById('msgErro');
            const infoEl = document.getElementById('msgInfo');
            errEl.classList.remove('show');
            infoEl.classList.remove('show');
            if (!telefone) { errEl.textContent = 'Informe seu telefone'; errEl.classList.add('show'); return; }
            btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Consultando...';
            try {
                const res = await fetch(API + '/pedidos/consulta', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telefone })
                });
                const json = await res.json();
                if (!json.success) throw new Error(json.message);
                telefoneAtual = telefone;
                pedidosCache = json.data || [];
                renderizarLista();
                if (pedidosCache.length === 0) {
                    infoEl.textContent = 'Nenhum pedido encontrado para este telefone.';
                    infoEl.classList.add('show');
                }
            } catch (err) {
                errEl.textContent = err.message;
                errEl.classList.add('show');
            } finally {
                btn.disabled = false; btn.innerHTML = '<i class="fas fa-search"></i> Consultar';
            }
        }
        function renderizarLista() {
            const el = document.getElementById('listaPedidos');
            if (!pedidosCache || pedidosCache.length === 0) {
                el.innerHTML = '<div class="empty"><i class="fas fa-box-open"></i><p>Nenhum pedido encontrado.</p></div>';
                return;
            }
            el.innerHTML = pedidosCache.map(p => `
                <div class="pedido-card" onclick="abrirDetalhe(${p.id})">
                    <div class="pedido-top">
                        <span class="pedido-id">Pedido #${p.id}</span>
                        <span class="pedido-data">${fmtData(p.data_criacao)}</span>
                    </div>
                    <span class="pedido-status" style="background:${statusCor(p.status)}">${p.status}</span>
                    <div class="pedido-info"><strong>${p.tipo_logistica || '—'}</strong>${p.tipo_logistica === 'Entrega' && p.endereco_rua ? ' · ' + (p.endereco_rua || '') + (p.endereco_numero ? ', ' + p.endereco_numero : '') : ''}</div>
                    <div class="pedido-info">Data entrega: <strong>${p.data_entrega || '—'}</strong> · Hora: <strong>${p.hora_entrega || '—'}</strong></div>
                    <div class="pedido-total">R$ ${fmt(p.valor_total)}</div>
                </div>
            `).join('');
        }
        async function abrirDetalhe(id) {
            const overlay = document.getElementById('overlay');
            const conteudo = document.getElementById('modalConteudo');
            overlay.classList.add('active');
            conteudo.innerHTML = '<div class="loading"><i class="fas fa-spinner"></i><br><br>Carregando...</div>';
            try {
                const res = await fetch(API + '/pedidos/consulta/' + id, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telefone: telefoneAtual })
                });
                const json = await res.json();
                if (!json.success) throw new Error(json.message);
                renderizarDetalhe(json);
            } catch (err) {
                conteudo.innerHTML = `<div class="msg error show">${err.message}</div>`;
            }
        }
        function renderizarDetalhe(json) {
            const p = json.data;
            const itens = json.itens || [];
            const historico = json.historico || [];
            const itensHtml = itens.length > 0
                ? itens.map(i => `<div class="item-linha"><span class="nome">${i.product_name || i.nome || ''}${i.label ? ' (' + i.label + ')' : ''}</span><span class="qtd">x${i.quantidade}</span><span class="preco">R$ ${fmt(i.preco_total)}</span></div>`).join('')
                : `<div class="linha"><span>${p.items || '—'}</span></div>`;
            const histHtml = historico.length > 0
                ? `<div class="timeline">${historico.map(h => `
                    <div class="tl-item">
                        <div class="st">${h.status_novo || h.status_anterior || ''}</div>
                        <div class="dt">${fmtData(h.created_at)}</div>
                        ${h.observacao ? `<div class="obs">${h.observacao}</div>` : ''}
                    </div>`).join('')}</div>`
                : `<div class="linha"><span>Sem histórico registrado</span></div>`;
            conteudo.innerHTML = `
                <h2>Pedido #${p.id}</h2>
                <div class="sub">Realizado em ${fmtData(p.data_criacao)}</div>
                ${statusBadge(p.status)}
                <div class="sec-titulo">📋 Itens</div>
                ${itensHtml}
                <div class="sec-titulo">🚚 Entrega</div>
                <div class="linha"><span>Tipo</span><span>${p.tipo_logistica || '—'}</span></div>
                ${p.tipo_logistica === 'Entrega' ? `<div class="linha"><span>Endereço</span><span>${[p.endereco_rua, p.endereco_numero, p.endereco_bairro, p.endereco_cep].filter(Boolean).join(', ') || '—'}</span></div>` : ''}
                <div class="linha"><span>Data</span><span>${p.data_entrega || '—'}</span></div>
                <div class="linha"><span>Horário</span><span>${p.hora_entrega || '—'}</span></div>
                <div class="sec-titulo">💳 Pagamento</div>
                <div class="linha"><span>Forma</span><span>${p.forma_pagamento || '—'}</span></div>
                <div class="linha"><span>Taxa de entrega</span><span>R$ ${fmt(p.taxa_entrega || 0)}</span></div>
                <div class="linha total"><span>Total</span><span>R$ ${fmt(p.valor_total)}</span></div>
                ${p.observacoes ? `<div class="sec-titulo">📝 Observações</div><div class="linha"><span>${p.observacoes}</span></div>` : ''}
                <div class="sec-titulo">🕐 Histórico do pedido</div>
                ${histHtml}
            `;
        }
        function fecharModal() {
            document.getElementById('overlay').classList.remove('active');
        }
        document.getElementById('telefone').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') consultar();
        });
        preencherTelefoneLogado();
    </script>
</body>
</html>
