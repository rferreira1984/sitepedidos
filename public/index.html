<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salgados Cia - Cardápio Digital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f8f5f0; color: #1a1a2e; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 16px; }

        .header-cliente { background: linear-gradient(135deg, #7c3aed, #6d28d9); padding: 16px 0; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 20px rgba(124,58,237,0.3); }
        .header-cliente .container { display: flex; justify-content: space-between; align-items: center; }
        .header-cliente h1 { font-size: 20px; font-weight: 800; color: #fff; }
        .header-cliente h1 span { font-weight: 300; }
        .header-cliente .subtitle { color: #c4b5fd; font-size: 12px; }
        .header-actions { display: flex; align-items: center; gap: 8px; }
        .btn-cart { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 8px 14px; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; transition: all 0.2s; position: relative; }
        .btn-cart:hover { background: rgba(255,255,255,0.25); }
        .cart-count { background: #fbbf24; color: #1a1a2e; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; position: absolute; top: -6px; right: -6px; }
        .btn-admin-link { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #c4b5fd; padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 11px; transition: all 0.2s; text-decoration: none; }
        .btn-admin-link:hover { background: rgba(255,255,255,0.1); color: #fff; }

        .categorias-nav { display: flex; gap: 8px; padding: 16px 0; overflow-x: auto; flex-wrap: nowrap; }
        .categorias-nav::-webkit-scrollbar { height: 4px; }
        .categorias-nav::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
        .cat-btn { padding: 8px 16px; background: #fff; border: 1px solid #e5e7eb; border-radius: 50px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s; white-space: nowrap; display: flex; align-items: center; gap: 4px; color: #4b5563; }
        .cat-btn:hover { border-color: #7c3aed; color: #7c3aed; }
        .cat-btn.active { background: #7c3aed; color: #fff; border-color: #7c3aed; }

        .produtos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; padding-bottom: 100px; }
        .produto-card { background: #fff; border-radius: 14px; padding: 16px; border: 1px solid #e5e7eb; transition: all 0.2s; display: flex; flex-direction: column; }
        .produto-card:hover { border-color: #7c3aed; box-shadow: 0 4px 16px rgba(124,58,237,0.1); transform: translateY(-2px); }
        .produto-icon { font-size: 36px; margin-bottom: 8px; }
        .produto-nome { font-size: 16px; font-weight: 700; color: #1a1a2e; margin-bottom: 4px; }
        .produto-desc { font-size: 12px; color: #6b7280; margin-bottom: 8px; flex: 1; }
        .produto-opcao { width: 100%; padding: 8px 10px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 12px; background: #fff; margin-bottom: 8px; cursor: pointer; outline: none; }
        .produto-opcao:focus { border-color: #7c3aed; }
        .produto-footer { display: flex; justify-content: space-between; align-items: center; }
        .produto-preco { font-size: 18px; font-weight: 800; color: #7c3aed; }
        .btn-add-cart { background: #7c3aed; border: none; color: #fff; width: 36px; height: 36px; border-radius: 10px; cursor: pointer; font-size: 16px; transition: all 0.2s; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .btn-add-cart:hover { background: #6d28d9; transform: scale(1.05); }

        .cart-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 200; }
        .cart-overlay.active { display: block; }
        .cart-sidebar { position: fixed; top: 0; right: -400px; width: 100%; max-width: 400px; height: 100%; background: #fff; z-index: 201; transition: right 0.3s ease; display: flex; flex-direction: column; box-shadow: -10px 0 30px rgba(0,0,0,0.1); }
        .cart-sidebar.open { right: 0; }
        .cart-header { padding: 16px 20px; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; }
        .cart-header h2 { font-size: 18px; font-weight: 700; }
        .cart-close { background: transparent; border: none; font-size: 22px; cursor: pointer; color: #6b7280; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .cart-close:hover { background: #f3f4f6; }
        .cart-items { flex: 1; overflow-y: auto; padding: 12px 20px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f3f4f6; }
        .cart-item-info { flex: 1; }
        .cart-item-name { font-weight: 600; font-size: 13px; }
        .cart-item-label { font-size: 11px; color: #7c3aed; }
        .cart-item-qty { display: flex; align-items: center; gap: 6px; }
        .cart-item-qty button { width: 26px; height: 26px; border-radius: 6px; border: 1px solid #e5e7eb; background: #fff; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; }
        .cart-item-qty button:hover { background: #f3f4f6; }
        .cart-item-qty span { font-weight: 700; font-size: 13px; min-width: 18px; text-align: center; }
        .cart-item-total { font-weight: 700; font-size: 13px; min-width: 55px; text-align: right; }
        .cart-empty { text-align: center; padding: 40px 20px; color: #9ca3af; }
        .cart-empty i { font-size: 40px; margin-bottom: 10px; }
        .cart-footer { padding: 16px 20px; border-top: 1px solid #e5e7eb; }
        .cart-total { display: flex; justify-content: space-between; font-size: 16px; font-weight: 700; margin-bottom: 12px; }
        .btn-checkout { width: 100%; padding: 12px; background: linear-gradient(135deg, #7c3aed, #6d28d9); border: none; border-radius: 10px; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
        .btn-checkout:hover { transform: translateY(-1px); box-shadow: 0 8px 25px rgba(124,58,237,0.3); }

        .checkout-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 300; justify-content: center; align-items: center; padding: 16px; }
        .checkout-overlay.active { display: flex; }
        .checkout-modal { background: #fff; border-radius: 16px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; padding: 24px; }
        .checkout-modal h2 { font-size: 20px; font-weight: 700; margin-bottom: 20px; }
        .checkout-modal .form-group { margin-bottom: 14px; }
        .checkout-modal .form-group label { display: block; font-size: 12px; font-weight: 600; color: #4b5563; margin-bottom: 4px; }
        .checkout-modal .form-group input, .checkout-modal .form-group select, .checkout-modal .form-group textarea { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 13px; outline: none; font-family: 'Inter', sans-serif; }
        .checkout-modal .form-group input:focus, .checkout-modal .form-group select:focus, .checkout-modal .form-group textarea:focus { border-color: #7c3aed; box-shadow: 0 0 0 3px rgba(124,58,237,0.1); }
        .checkout-modal .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .checkout-modal .resumo-pedido { background: #f9fafb; border-radius: 10px; padding: 14px; margin: 14px 0; }
        .checkout-modal .resumo-item { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; }
        .checkout-modal .resumo-total { display: flex; justify-content: space-between; font-size: 16px; font-weight: 700; padding-top: 10px; border-top: 1px solid #e5e7eb; margin-top: 6px; }

        .toast { position: fixed; bottom: 20px; right: 20px; padding: 14px 20px; border-radius: 10px; color: #fff; font-size: 13px; font-weight: 500; z-index: 2000; display: none; animation: slideIn 0.3s ease; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .toast.success { background: #059669; }
        .toast.error { background: #dc2626; }
        .toast.info { background: #2563eb; }
        .toast.show { display: block; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .loading-spinner { text-align: center; padding: 40px; color: #6b7280; }
        .loading-spinner i { font-size: 28px; animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .produtos-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .produto-card { padding: 12px; }
            .produto-icon { font-size: 28px; }
            .produto-nome { font-size: 14px; }
            .produto-preco { font-size: 15px; }
            .checkout-modal .form-row { grid-template-columns: 1fr; }
            .cart-sidebar { max-width: 100%; }
        }
    </style>
</head>
<body>
    <div id="toast" class="toast"></div>

    <header class="header-cliente">
        <div class="container">
            <div>
                <h1>Salgados <span>Cia</span></h1>
                <div class="subtitle">Faça seu pedido online 📱</div>
            </div>
            <div class="header-actions">
                <a href="/admin" class="btn-admin-link"><i class="fas fa-user-shield"></i> Admin</a>
                <button class="btn-cart" onclick="abrirCarrinho()">
                    <i class="fas fa-shopping-bag"></i> Carrinho
                    <span class="cart-count" id="cartCount">0</span>
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <nav class="categorias-nav" id="categoriasNav">
            <button class="cat-btn active" onclick="filtrarCategoria('')">🍽️ Todos</button>
        </nav>

        <section class="produtos-grid" id="produtosGrid">
            <div class="loading-spinner"><i class="fas fa-spinner"></i><br><br>Carregando cardápio...</div>
        </section>
    </main>

    <div class="cart-overlay" id="cartOverlay" onclick="fecharCarrinho()"></div>
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h2>🛒 Carrinho</h2>
            <button class="cart-close" onclick="fecharCarrinho()">&times;</button>
        </div>
        <div class="cart-items" id="cartItems">
            <div class="cart-empty">
                <i class="fas fa-shopping-bag"></i>
                <p>Seu carrinho está vazio</p>
                <p style="font-size:12px;color:#d1d5db;">Adicione produtos do cardápio</p>
            </div>
        </div>
        <div class="cart-footer" id="cartFooter" style="display:none;">
            <div class="cart-total">
                <span>Total</span>
                <span id="cartTotal">R$ 0,00</span>
            </div>
            <button class="btn-checkout" onclick="abrirCheckout()"><i class="fas fa-check-circle"></i> Fechar Pedido</button>
        </div>
    </div>

    <div class="checkout-overlay" id="checkoutOverlay">
        <div class="checkout-modal">
            <h2>📋 Finalizar Pedido</h2>
            <form id="checkoutForm" onsubmit="return finalizarPedido(event)">
                <div class="form-group">
                    <label>Nome completo *</label>
                    <input type="text" id="checkoutNome" placeholder="Seu nome" required>
                </div>
                <div class="form-group">
                    <label>Telefone / WhatsApp *</label>
                    <input type="tel" id="checkoutTelefone" placeholder="(11) 99999-9999" required>
                </div>
                <div class="form-group">
                    <label>Endereço de entrega</label>
                    <div class="form-row">
                        <input type="text" id="checkoutRua" placeholder="Rua" style="grid-column:1/-1;">
                    </div>
                    <div class="form-row" style="margin-top:6px;">
                        <input type="text" id="checkoutNumero" placeholder="Número">
                        <input type="text" id="checkoutBairro" placeholder="Bairro">
                    </div>
                </div>
                <div class="form-group">
                    <label>Forma de pagamento</label>
                    <select id="checkoutPagamento">
                        <option value="Dinheiro">Dinheiro</option>
                        <option value="Pix">Pix</option>
                        <option value="Cartão Crédito">Cartão de Crédito</option>
                        <option value="Cartão Débito">Cartão de Débito</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Tipo de entrega</label>
                    <select id="checkoutLogistica">
                        <option value="Entrega">Entrega</option>
                        <option value="Retirada">Retirada no local</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Observações</label>
                    <textarea id="checkoutObs" rows="2" placeholder="Alguma observação?"></textarea>
                </div>
                <div class="resumo-pedido" id="resumoPedido">
                    <div style="font-weight:600;margin-bottom:6px;font-size:13px;">Resumo do pedido</div>
                    <div id="resumoItems"></div>
                    <div class="resumo-total">
                        <span>Total</span>
                        <span id="resumoTotal">R$ 0,00</span>
                    </div>
                </div>
                <button type="submit" id="btnFinalizar" class="btn-checkout"><i class="fas fa-check-circle"></i> Confirmar Pedido</button>
                <button type="button" class="btn-checkout" style="background:#6b7280;margin-top:6px;" onclick="fecharCheckout()">Voltar</button>
            </form>
        </div>
    </div>

    <script>
        const API = '/api';
        let carrinho = JSON.parse(localStorage.getItem('carrinho') || '[]');
        let produtosData = [];
        let categoriasData = [];

        function mostrarToast(msg, tipo) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast ' + tipo + ' show';
            setTimeout(() => t.classList.remove('show'), 4000);
        }

        async function carregarCardapio() {
            try {
                const [catRes, prodRes] = await Promise.all([
                    fetch(API + '/categorias'),
                    fetch(API + '/produtos')
                ]);
                const catJson = await catRes.json();
                const prodJson = await prodRes.json();
                categoriasData = catJson.data || [];
                produtosData = prodJson.data || [];

                const nav = document.getElementById('categoriasNav');
                nav.innerHTML = '<button class="cat-btn active" onclick="filtrarCategoria(\'\')">🍽️ Todos</button>';
                categoriasData.forEach(c => {
                    nav.innerHTML += `<button class="cat-btn" onclick="filtrarCategoria('${c.name}')">${c.slug === 'salgados-fritos' ? '🍤' : c.slug === 'salgados-assados' ? '🥟' : c.slug === 'doces-tradicionais' ? '🍩' : c.slug === 'doces-gourmet' ? '✨' : c.slug === 'bolos-por-kg' ? '🎂' : c.slug === 'sobremesas' ? '🍮' : c.slug === 'kits-festa' ? '🎉' : '📦'} ${c.name}</button>`;
                });
                renderizarProdutos(produtosData);
            } catch (err) {
                document.getElementById('produtosGrid').innerHTML = '<p style="text-align:center;padding:40px;color:#f87171;">Erro ao carregar cardápio</p>';
            }
        }

        function renderizarProdutos(produtos) {
            const grid = document.getElementById('produtosGrid');
            if (!produtos || produtos.length === 0) {
                grid.innerHTML = '<p style="text-align:center;padding:40px;color:#6b7280;">Nenhum produto disponível.</p>';
                return;
            }
            grid.innerHTML = produtos.map(p => {
                const precos = p.prices || [];
                const menorPreco = precos.length > 0 ? Math.min(...precos.map(pr => parseFloat(pr.price))) : 0;
                const icone = p.slug === 'coxinha' ? '🥟' : p.slug === 'brigadeiro' ? '🍫' : p.slug === 'beijinho' ? '🥥' : p.slug === 'bolo-de-chocolate' ? '🎂' : p.slug === 'kit-festa-completo' ? '🎉' : p.slug === 'festa-na-caixa' ? '📦' : '🍽️';
                return `
                    <div class="produto-card">
                        <div class="produto-icon">${icone}</div>
                        <div class="produto-nome">${p.name}</div>
                        <div class="produto-desc">${p.description || ''}</div>
                        ${precos.length > 0 ? `
                            <select class="produto-opcao" id="opcao-${p.id}">
                                ${precos.map(pr =>
                                    `<option value='${JSON.stringify({priceId: pr.id, price: pr.price, label: pr.label, qty: pr.quantity, unit: pr.unit_label, priceType: pr.price_type, composicao: pr.composicao || '', opcoes: pr.opcoes || '', regras: pr.regras || ''})}'>
                                        ${pr.label} — R$ ${parseFloat(pr.price).toFixed(2).replace('.', ',')}
                                    </option>`
                                ).join('')}
                            </select>
                        ` : '<div style="height:36px;"></div>'}
                        <div class="produto-footer">
                            <div class="produto-preco">${menorPreco > 0 ? `R$ ${menorPreco.toFixed(2).replace('.', ',')}` : ''}</div>
                            <button class="btn-add-cart" onclick="adicionarAoCarrinho(${p.id}, '${p.name.replace(/'/g, "\'")}', '${icone}')"><i class="fas fa-plus"></i></button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filtrarCategoria(categoria) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            if (!categoria) {
                renderizarProdutos(produtosData);
            } else {
                renderizarProdutos(produtosData.filter(p => p.categoria_nome === categoria));
            }
        }

        function adicionarAoCarrinho(id, nome, icone) {
            const select = document.getElementById(`opcao-${id}`);
            if (!select) { mostrarToast('Erro: produto sem opção', 'error'); return; }
            const opt = JSON.parse(select.value);
            const precoUnit = parseFloat(opt.price);
            const existente = carrinho.find(i => i.id === id && i.priceId === opt.priceId);
            if (existente) {
                existente.qtd += 1;
            } else {
                carrinho.push({ id, priceId: opt.priceId, nome, icone: icone || '🍽️', preco: precoUnit, label: opt.label, qtd: 1, priceType: opt.priceType, composicao: opt.composicao, opcoes: opt.opcoes, regras: opt.regras });
            }
            localStorage.setItem('carrinho', JSON.stringify(carrinho));
            atualizarCarrinhoUI();
            mostrarToast(`${nome} (${opt.label}) adicionado!`, 'success');
        }

        function alterarQtd(id, priceId, delta) {
            const item = carrinho.find(i => i.id === id && i.priceId === priceId);
            if (!item) return;
            item.qtd += delta;
            if (item.qtd <= 0) {
                carrinho = carrinho.filter(i => !(i.id === id && i.priceId === priceId));
            }
            localStorage.setItem('carrinho', JSON.stringify(carrinho));
            atualizarCarrinhoUI();
        }

        function atualizarCarrinhoUI() {
            const count = carrinho.reduce((s, i) => s + i.qtd, 0);
            document.getElementById('cartCount').textContent = count;
            const itemsEl = document.getElementById('cartItems');
            const footerEl = document.getElementById('cartFooter');
            if (carrinho.length === 0) {
                itemsEl.innerHTML = '<div class="cart-empty"><i class="fas fa-shopping-bag"></i><p>Seu carrinho está vazio</p><p style="font-size:12px;color:#d1d5db;">Adicione produtos do cardápio</p></div>';
                footerEl.style.display = 'none';
                return;
            }
            footerEl.style.display = 'block';
            let total = 0;
            itemsEl.innerHTML = carrinho.map(item => {
                const sub = item.preco * item.qtd;
                total += sub;
                return `<div class="cart-item">
                    <div class="cart-item-info">
                        <div class="cart-item-name">${item.icone || '🍽️'} ${item.nome}</div>
                        <div class="cart-item-label">${item.label}</div>
                    </div>
                    <div class="cart-item-qty">
                        <button onclick="alterarQtd(${item.id}, ${item.priceId}, -1)">−</button>
                        <span>${item.qtd}</span>
                        <button onclick="alterarQtd(${item.id}, ${item.priceId}, 1)">+</button>
                    </div>
                    <div class="cart-item-total">R$ ${sub.toFixed(2).replace('.', ',')}</div>
                </div>`;
            }).join('');
            document.getElementById('cartTotal').textContent = `R$ ${total.toFixed(2).replace('.', ',')}`;
        }

        function abrirCarrinho() {
            document.getElementById('cartOverlay').classList.add('active');
            document.getElementById('cartSidebar').classList.add('open');
        }

        function fecharCarrinho() {
            document.getElementById('cartOverlay').classList.remove('active');
            document.getElementById('cartSidebar').classList.remove('open');
        }

        function abrirCheckout() {
            if (carrinho.length === 0) { mostrarToast('Carrinho vazio!', 'error'); return; }
            fecharCarrinho();
            let total = 0;
            const itemsHtml = carrinho.map(i => {
                const sub = i.preco * i.qtd;
                total += sub;
                return `<div class="resumo-item"><span>${i.icone || '🍽️'} ${i.nome} - ${i.label} x${i.qtd}</span><span>R$ ${sub.toFixed(2).replace('.', ',')}</span></div>`;
            }).join('');
            document.getElementById('resumoItems').innerHTML = itemsHtml;
            document.getElementById('resumoTotal').textContent = `R$ ${total.toFixed(2).replace('.', ',')}`;
            document.getElementById('checkoutOverlay').classList.add('active');
        }

        function fecharCheckout() {
            document.getElementById('checkoutOverlay').classList.remove('active');
        }

        async function finalizarPedido(e) {
            e.preventDefault();
            const nome = document.getElementById('checkoutNome').value.trim();
            const telefone = document.getElementById('checkoutTelefone').value.trim();
            if (!nome || !telefone) { mostrarToast('Nome e telefone obrigatórios', 'error'); return; }
            if (carrinho.length === 0) { mostrarToast('Carrinho vazio!', 'error'); return; }
            const btn = document.getElementById('btnFinalizar');
            btn.disabled = true; btn.textContent = 'Enviando...';
            const itemsStr = carrinho.map(i => `${i.icone || ''} ${i.nome} (${i.label}) x${i.qtd} = R$ ${(i.preco * i.qtd).toFixed(2)}`).join(' | ');
            const total = carrinho.reduce((s, i) => s + i.preco * i.qtd, 0);
            try {
                const res = await fetch(API + '/pedidos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nome_cliente: nome, telefone,
                        endereco_rua: document.getElementById('checkoutRua').value,
                        endereco_numero: document.getElementById('checkoutNumero').value,
                        endereco_bairro: document.getElementById('checkoutBairro').value,
                        items: itemsStr, valor_total: total,
                        forma_pagamento: document.getElementById('checkoutPagamento').value,
                        tipo_logistica: document.getElementById('checkoutLogistica').value,
                        observacoes: document.getElementById('checkoutObs').value
                    })
                });
                const json = await res.json();
                if (!json.success) throw new Error(json.message);
                mostrarToast('✅ Pedido realizado com sucesso!', 'success');
                carrinho = []; localStorage.setItem('carrinho', JSON.stringify(carrinho));
                atualizarCarrinhoUI(); fecharCheckout();
                document.getElementById('checkoutForm').reset();
            } catch (err) { mostrarToast('Erro: ' + err.message, 'error'); }
            finally { btn.disabled = false; btn.textContent = 'Confirmar Pedido'; }
        }

        carregarCardapio();
        atualizarCarrinhoUI();
    </script>
</body>
</html>
