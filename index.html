<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Pedidos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="main-header">
        <div class="container header-content">
            <div class="logo-area">
                <h1>📦 Painel de Pedidos</h1>
                <span class="badge-total" id="totalBadge">0</span>
            </div>
            <div class="user-area">
                <span class="current-date" id="currentDate"></span>
                <div class="avatar">AD</div>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon icon-total"><i class="fas fa-shopping-cart"></i></div>
                <div class="stat-info">
                    <span class="stat-label">Total de Pedidos</span>
                    <span class="stat-value" id="statTotal">0</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon icon-pending"><i class="fas fa-clock"></i></div>
                <div class="stat-info">
                    <span class="stat-label">Pendentes</span>
                    <span class="stat-value" id="statPendentes">0</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon icon-progress"><i class="fas fa-truck-fast"></i></div>
                <div class="stat-info">
                    <span class="stat-label">Em Andamento</span>
                    <span class="stat-value" id="statAndamento">0</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon icon-delivered"><i class="fas fa-check-circle"></i></div>
                <div class="stat-info">
                    <span class="stat-label">Entregues</span>
                    <span class="stat-value" id="statEntregues">0</span>
                </div>
            </div>
        </section>

        <section class="filter-bar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Buscar por cliente, ID ou produto...">
            </div>
            <div class="filters-group">
                <select class="filter-select" id="statusFilter">
                    <option value="">Todos os Status</option>
                    <option value="Pendente">Pendente</option>
                    <option value="Em Andamento">Em Andamento</option>
                    <option value="Entregue">Entregue</option>
                </select>
                <button class="btn-filter" id="btnFilter"><i class="fas fa-filter"></i> Buscar</button>
            </div>
        </section>

        <section class="table-container">
            <table class="orders-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Cliente</th>
                        <th>Telefone</th>
                        <th>Produtos</th>
                        <th>Valor Total</th>
                        <th>Pagamento</th>
                        <th>Logística</th>
                        <th>Data</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="ordersBody">
                    <tr>
                        <td colspan="10" style="text-align:center;padding:40px;color:#9ca3af;">
                            Carregando pedidos...
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>

        <div id="pagination" style="display:flex;justify-content:space-between;align-items:center;padding:16px 0;gap:12px;flex-wrap:wrap;">
            <span id="paginationInfo" style="font-size:14px;color:#6b7280;"></span>
            <div style="display:flex;gap:8px;">
                <button id="prevPage" class="btn-filter" style="background:#e5e7eb;color:#1a1a2e;">← Anterior</button>
                <button id="nextPage" class="btn-filter">Próximo →</button>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <div class="container">
            <p>Painel de Pedidos v2.0 — Dados do banco PostgreSQL — 2026</p>
        </div>
    </footer>

    <script>
        document.getElementById('currentDate').textContent =
            new Date().toLocaleDateString('pt-BR', { day: 'numeric', month: 'long', year: 'numeric' });

        const API = 'http://localhost:3001/api/pedidos';
        let currentPage = 1, totalPages = 1;

        function fmtMoney(v) {
            return 'R$ ' + parseFloat(v || 0).toFixed(2).replace('.', ',');
        }

        function statusBadge(s) {
            var cls = 'delivered';
            if (s === 'Pendente') cls = 'pending';
            else if (s === 'Em Andamento' || s === 'Em andamento') cls = 'in-progress';
            return '<span class="status-badge ' + cls + '">' + s + '</span>';
        }

        async function carregar(page) {
            page = page || 1;
            var search = document.getElementById('searchInput').value;
            var status = document.getElementById('statusFilter').value;
            var url = API + '?page=' + page + '&limit=20';
            if (search) url += '&search=' + encodeURIComponent(search);
            if (status) url += '&status=' + encodeURIComponent(status);

            try {
                var res = await fetch(url);
                var json = await res.json();
                if (!json.success) throw new Error(json.message);

                var data = json.data;
                var pg = json.pagination;
                var st = json.stats;

                currentPage = pg.page;
                totalPages = pg.totalPages;

                document.getElementById('statTotal').textContent = st ? st.total : pg.total;
                document.getElementById('statPendentes').textContent = st ? st.pendentes : 0;
                document.getElementById('statAndamento').textContent = st ? st.em_andamento : 0;
                document.getElementById('statEntregues').textContent = st ? st.entregues : 0;
                document.getElementById('totalBadge').textContent = pg.total;

                var tbody = document.getElementById('ordersBody');

                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:40px;color:#9ca3af;">Nenhum pedido encontrado.</td></tr>';
                } else {
                    var html = '';
                    for (var i = 0; i < data.length; i++) {
                        var p = data[i];
                        var idStr = String(p.id).padStart(3, '0');
                        var nome = p.nome_cliente || '';
                        var fone = p.telefone || '-';
                        var prod = p.items || '-';
                        var valor = fmtMoney(p.valor_total);
                        var pag = p.forma_pagamento || '-';
                        var logis = p.tipo_logistica || '-';
                        var dataCriacao = p.data_criacao ? new Date(p.data_criacao).toLocaleDateString('pt-BR') : '-';
                        var badge = statusBadge(p.status);
                        html += '<tr>' +
                            '<td><strong>#' + idStr + '</strong></td>' +
                            '<td>' + nome + '</td>' +
                            '<td>' + fone + '</td>' +
                            '<td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;">' + prod + '</td>' +
                            '<td>' + valor + '</td>' +
                            '<td>' + pag + '</td>' +
                            '<td>' + logis + '</td>' +
                            '<td>' + dataCriacao + '</td>' +
                            '<td>' + badge + '</td>' +
                            '<td><button class="btn-action" onclick="verPedido(' + p.id + ')"><i class="fas fa-eye"></i></button></td>' +
                            '</tr>';
                    }
                    tbody.innerHTML = html;
                }

                document.getElementById('paginationInfo').textContent =
                    'Página ' + currentPage + ' de ' + totalPages + ' (' + pg.total + ' pedidos)';

                document.getElementById('prevPage').style.display = (currentPage <= 1) ? 'none' : 'inline-flex';
                document.getElementById('nextPage').style.display = (currentPage >= totalPages) ? 'none' : 'inline-flex';

            } catch (err) {
                document.getElementById('ordersBody').innerHTML =
                    '<tr><td colspan="10" style="text-align:center;padding:40px;color:#e94560;">' +
                    'Erro ao carregar: ' + err.message + '</td></tr>';
            }
        }

        async function verPedido(id) {
            try {
                var res = await fetch(API + '/' + id);
                var json = await res.json();
                if (!json.success) throw new Error(json.message);
                var p = json.data;
                alert(
                    'Pedido #' + String(p.id).padStart(3, '0') + '\n' +
                    'Cliente: ' + p.nome_cliente + '\n' +
                    'Telefone: ' + (p.telefone || '-') + '\n' +
                    'Endereço: ' + (p.endereco_rua || '') + ', ' + (p.endereco_numero || '') + '\n' +
                    'Bairro: ' + (p.endereco_bairro || '-') + ' | CEP: ' + (p.endereco_cep || '-') + '\n' +
                    'Produtos: ' + p.items + '\n' +
                    'Valor: ' + fmtMoney(p.valor_total) + '\n' +
                    'Pagamento: ' + (p.forma_pagamento || '-') + '\n' +
                    'Logística: ' + (p.tipo_logistica || '-') + '\n' +
                    'Status: ' + p.status + '\n' +
                    'Criado: ' + new Date(p.data_criacao).toLocaleString('pt-BR')
                );
            } catch (e) {
                alert('Erro: ' + e.message);
            }
        }

        document.getElementById('btnFilter').addEventListener('click', function() { carregar(1); });
        document.getElementById('searchInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') carregar(1);
        });
        document.getElementById('prevPage').addEventListener('click', function() {
            if (currentPage > 1) carregar(currentPage - 1);
        });
        document.getElementById('nextPage').addEventListener('click', function() {
            if (currentPage < totalPages) carregar(currentPage + 1);
        });

        carregar(1);
    </script>
</body>
</html>
